[package]
name = "ckb-rust-cli-lab"
version = "0.1.0"
edition = "2021"
description = "CKB Rust SDK exercises (Windows: MSVC toolchain + MSYS2 mingw64 gcc on PATH)"
default-run = "ckb-rust-cli-lab"

[[bin]]
name = "ckb-rust-cli-lab"
path = "src/main.rs"

[dependencies]
ckb-sdk = "3.2.0"
ckb-crypto = "0.200"
ckb-types = "0.200"
secp256k1 = { version = "0.30", features = ["recovery"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = "1.0"
hex = "0.4"
rand = "0.8"
