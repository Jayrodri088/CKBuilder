[workspace]
resolver = "2"

members = [
  # Please don't remove the following line, we use it to automatically
  # detect insertion point for newly generated crates.
  # @@INSERTION_POINT@@
  "contracts/hello-world",
  "contracts/simple-print-args",
  "tests",
]

[profile.release]
overflow-checks = true
strip = false
codegen-units = 1
debug = true

# molecule 0.8+ uses `bytes` with atomics; bytes_vec avoids RISC-V A instructions on CKB-VM.
[patch.crates-io]
molecule = { version = "0.9.2", default-features = false, features = ["bytes_vec"] }
